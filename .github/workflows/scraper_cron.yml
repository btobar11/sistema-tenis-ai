name: Tennis AI Automation

on:
  schedule:
    - cron: '0 * * * *' # Hourly
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape-and-predict:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # Upgrade to newer Python
          cache: 'pip' # Cache dependencies

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scrapers/requirements.txt

      - name: Run Scraper & AI
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }} # Ensure this matches Service Role or Anon Key as needed
          PYTHONPATH: .
        run: |
          python scrapers/cron_job.py
