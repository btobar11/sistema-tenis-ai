name: Tennis AI - Automated Scrapers

on:
  schedule:
    # Upcoming matches - Every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:  # Allow manual trigger

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

jobs:
  scrape-upcoming:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install curl_cffi beautifulsoup4 lxml supabase python-dateutil
      
      - name: Run Upcoming Scraper
        working-directory: ./scrapers
        run: |
          echo "🎾 Starting Upcoming Matches Scraper..."
          python -c "
          import sys
          sys.stdout.reconfigure(encoding='utf-8')
          from upcoming_scraper import run_upcoming_scraper
          run_upcoming_scraper()
          "
          echo "✅ Upcoming scraper completed"
      
      - name: Run Live Monitor
        working-directory: ./scrapers
        run: |
          echo "📡 Starting Live Monitor..."
          python -c "
          import sys
          sys.stdout.reconfigure(encoding='utf-8')
          from live_monitor import get_db_client, get_tracked_players, monitor_cycle
          db = get_db_client()
          tracked = get_tracked_players(db)
          if tracked:
              print(f'Tracking {len(tracked)} players')
              monitor_cycle(db, tracked)
          else:
              print('No active players to track')
          "
          echo "✅ Live monitor completed"

  # Value bets - Runs every hour (separate job)
  calculate-value:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only run on the hour (when minute is 0)
    if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install supabase
      
      - name: Calculate Value Bets
        working-directory: ./scrapers
        run: |
          echo "💰 Calculating value bets..."
          python -c "
          import sys
          sys.path.insert(0, '../metrics')
          from db_client import get_db_client
          try:
              from value import ValueBetEngine
              db = get_db_client()
              engine = ValueBetEngine(db)
              engine.process_value_bets()
              print('Value bets calculated')
          except Exception as e:
              print(f'Value calculation skipped: {e}')
          "
